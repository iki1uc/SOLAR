<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LICHT · Energie · ALUF</title>
<style>
body { background:#000; color:#ff0; font-family:Consolas; padding:20px; }
pre { font-size:16px; }
</style>
</head>
<body>

<h2>LICHT · Energie</h2>
<pre id="light">INIT…</pre>

<script type="module">
import { Schwingung } from "./uni.engine.js";

let f = 1;

function glow(){
    const s = Schwingung.calc(f);

    document.getElementById("light").innerText = `
LICHT FRAME ${f}

Energie (+1): ${s.energy}
Solar (-1): ${s.solar}
Lichtkraft: ${s.energy - s.solar}
Schwingung: ${s.swing}
ALUF-Licht: life360
`;

    f++;
}

setInterval(glow, 250);
</script>

</body>
</html>
