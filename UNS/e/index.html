<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAGE · DURCHLASSACHSE · RESPO.ai · iki1uc</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0806;
            color: #c8b89a;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .stage {
            max-width: 800px;
            width: 100%;
            background: #0d0a07;
            border: 1px solid #2a1a1a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 80px rgba(0,0,0,0.6);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 12px;
            color: #c8b89a;
            text-align: center;
            font-weight: 300;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        h1 .highlight { color: #8a7a6a; }
        h1 .iki1uc { color: #5a4a3a; font-size: 1rem; letter-spacing: 4px; }

        .subtitle {
            text-align: center;
            font-size: 0.65rem;
            color: #5a4a3a;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle .respo { color: #8a7a6a; }

        #cube {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1/1;
            margin: 15px auto;
            position: relative;
            background: #060504;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        .pixel {
            position: absolute;
            border-radius: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .pixel:hover {
            transform: scale(1.2);
            z-index: 10;
            box-shadow: 0 0 30px rgba(200,180,120,0.15);
        }

        .pixel .label {
            position: absolute;
            font-size: 4px;
            color: rgba(200,180,120,0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .pixel:hover .label { opacity: 1; }

        #status {
            margin: 12px 0;
            padding: 10px 15px;
            font-size: 0.6rem;
            color: #5a4a3a;
            letter-spacing: 2px;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            min-height: 40px;
            line-height: 1.8;
        }

        #status .value { color: #8a7a6a; }
        #status .highlight { color: #c8b89a; }
        #status .ok { color: #6a8a6a; }
        #status .max { color: #c8b89a; }
        #status .min { color: #5a4a3a; }

        #log {
            width: 100%;
            height: 100px;
            background: #060504;
            color: #3a2a1a;
            border: 1px solid #1a1a1a;
            padding: 10px;
            overflow: auto;
            font-size: 0.5rem;
            font-family: monospace;
            border-radius: 4px;
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #log .key { color: #6a5a4a; }
        #log .num { color: #8a7a6a; }
        #log .str { color: #c8b89a; }
        #log .max { color: #c8b89a; }
        #log .min { color: #5a4a3a; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0;
        }

        .controls button {
            background: transparent;
            color: #5a4a3a;
            border: 1px solid #1a1a1a;
            padding: 6px 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .controls button:hover {
            background: #1a1a1a;
            color: #c8b89a;
            border-color: #5a4a3a;
        }

        .controls button.primary {
            border-color: #5a4a3a;
            color: #8a7a6a;
        }

        .controls button.primary:hover {
            background: #5a4a3a;
            color: #0a0806;
        }

        .controls button.max {
            border-color: #8a7a6a;
            color: #c8b89a;
        }

        .controls button.max:hover {
            background: #8a7a6a;
            color: #0a0806;
        }

        .controls button.min {
            border-color: #3a2a1a;
            color: #5a4a3a;
        }

        .controls button.min:hover {
            background: #3a2a1a;
            color: #c8b89a;
        }

        .footer {
            margin-top: 12px;
            font-size: 0.45rem;
            color: #1a1a1a;
            letter-spacing: 4px;
            text-align: center;
        }

        .footer .iki1uc { color: #2a2a2a; }

        .pulse-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3a2a1a;
            margin-right: 6px;
            transition: all 0.3s;
        }

        .pulse-indicator.active {
            background: #8a7a6a;
            box-shadow: 0 0 20px rgba(200,180,120,0.15);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (max-width: 480px) {
            .stage { padding: 15px; }
            h1 { font-size: 1.3rem; letter-spacing: 6px; }
            h1 .iki1uc { font-size: 0.7rem; }
            .controls button { font-size: 0.45rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="stage">
    <h1>
        STAGE
        <span class="highlight">·</span>
        RESPO<span class="iki1uc">.ai</span>
        <br>
        <span class="iki1uc">iki1uc</span>
    </h1>
    <div class="subtitle">
        DURCHLASSACHSE · <span class="respo">MAXIMUM · MINIMUM</span> · 3Ø9Ø81
    </div>

    <div id="cube"></div>

    <div id="status">
        <span class="pulse-indicator" id="pulse"></span>
        ⏳ STAGE · <span class="highlight">DURCHLASSACHSE AKTIV</span>
    </div>

    <div class="controls">
        <button class="primary" id="btnRun">▶ RUN</button>
        <button id="btnReset">⟲ RESET</button>
        <button class="max" id="btnMax">⬆ MAXIMUM</button>
        <button class="min" id="btnMin">⬇ MINIMUM</button>
        <button id="btnRespo">🌀 RESPO</button>
        <button id="btnStage">🎯 STAGE</button>
    </div>

    <div id="log">⏳ Warten auf STAGE...</div>

    <div class="footer">SOLAR · ALUF · EVOTAAL · NIRWANA · SEN·SA·TION · <span class="iki1uc">iki1uc</span></div>
</div>

<script type="importmap">
{
    "imports": {
        "./algorithmik.js": "./algorithmik.js",
        "./cache.driver.js": "./cache.driver.js",
        "./graviton.js": "./graviton.js",
        "./uni.engine.js": "./uni.engine.js",
        "./aluf.js": "./aluf.js",
        "./evotaal.js": "./evotaal.js",
        "./nirwana.js": "./nirwana.js"
    }
}
</script>

<script type="module">
// ─── IMPORTS ────────────────────────────────────────────────
import { Algorithmik } from './algorithmik.js';
import { CacheDriver } from './cache.driver.js';
import { UNIEngine } from './uni.engine.js';
import { ALUF } from './aluf.js';
import { EVOTAAL } from './evotaal.js';
import { NIRWANA } from './nirwana.js';

// ─── DOM ────────────────────────────────────────────────────
const cube = document.getElementById('cube');
const status = document.getElementById('status');
const log = document.getElementById('log');
const pulse = document.getElementById('pulse');

const btnRun = document.getElementById('btnRun');
const btnReset = document.getElementById('btnReset');
const btnMax = document.getElementById('btnMax');
const btnMin = document.getElementById('btnMin');
const btnRespo = document.getElementById('btnRespo');
const btnStage = document.getElementById('btnStage');

// ─── ROOT ────────────────────────────────────────────────────
const ROOT = { height: 480, width: 480, depth: 480 };

// ─── STATE ──────────────────────────────────────────────────
let state = {
    values: [3, 9, 27, 81, 243, 729, 2187, 6561, 19683],
    axis3: [],
    axis9: [],
    axis27: [],
    axis81: [],
    pipeline21: [],
    life360: [],
    blitz21: [],
    graviton: {},
    shadow: null,
    aluf: null,
    evo: null,
    nirwana: null,
    respo: false,
    stage: false,
    maxMode: false,
    minMode: false,
    pixels: []
};

// ─── CUBE · 9×9 ─────────────────────────────────────────────
function buildCube() {
    cube.innerHTML = '';
    state.pixels = [];
    const size = cube.clientWidth || 420;
    const cellSize = (size - 4) / 9;

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.style.width = cellSize + 'px';
            pixel.style.height = cellSize + 'px';
            pixel.style.left = (c * (cellSize + 2) + 2) + 'px';
            pixel.style.top = (r * (cellSize + 2) + 2) + 'px';

            const v = (r * 9 + c + 1);
            pixel.dataset.value = v;
            pixel.dataset.row = r;
            pixel.dataset.col = c;

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = v;
            pixel.appendChild(label);

            pixel.addEventListener('click', () => {
                const val = parseInt(pixel.dataset.value);
                log.textContent = `🎯 PIXEL ${val} · MAX: ${state.values[state.values.length-1] || val} · MIN: ${state.values[0] || val}`;
            });

            cube.appendChild(pixel);
            state.pixels.push(pixel);
        }
    }
}

// ─── RENDER ──────────────────────────────────────────────────
function render(values) {
    const pixels = state.pixels;
    const sorted = [...values].sort((a, b) => a - b);
    const max = sorted.length > 0 ? sorted[sorted.length - 1] : 1;
    const min = sorted.length > 0 ? sorted[0] : 1;

    pixels.forEach(pixel => {
        const val = parseInt(pixel.dataset.value);
        const has = values.includes(val);
        const intensity = has ? (val / max) : 0;

        if (has) {
            const bright = Math.floor(40 + intensity * 200);
            const r = Math.floor(80 + intensity * 120);
            const g = Math.floor(60 + intensity * 100);
            const b = Math.floor(20 + intensity * 80);
            pixel.style.background = `rgb(${r}, ${g}, ${b})`;
            pixel.style.opacity = '1';
            pixel.style.border = `1px solid rgba(200,180,120,${0.1 + intensity * 0.3})`;

            // MAX/MIN Markierung
            if (state.maxMode && val === max) {
                pixel.style.border = '2px solid #c8b89a';
                pixel.style.boxShadow = '0 0 30px rgba(200,180,120,0.2)';
            }
            if (state.minMode && val === min) {
                pixel.style.border = '2px solid #5a4a3a';
                pixel.style.boxShadow = '0 0 30px rgba(90,74,58,0.2)';
            }

            // RESPO
            if (state.respo) {
                pixel.style.borderRadius = '50%';
                pixel.style.transform = `scale(${0.8 + intensity * 0.3})`;
            } else {
                pixel.style.borderRadius = '1px';
                pixel.style.transform = 'scale(1)';
            }

            // STAGE
            if (state.stage) {
                pixel.style.boxShadow = `0 0 ${20 + intensity * 30}px rgba(200,180,120,${0.05 + intensity * 0.1})`;
            }
        } else {
            pixel.style.background = '#060504';
            pixel.style.opacity = '0.2';
            pixel.style.border = '1px solid #0a0a0a';
            pixel.style.boxShadow = 'none';
            pixel.style.borderRadius = '1px';
            pixel.style.transform = 'scale(1)';
        }
    });

    // Status
    const activeCount = values.length;
    status.innerHTML = `
        <span class="pulse-indicator ${activeCount > 0 ? 'active' : ''}"></span>
        STAGE · <span class="highlight">${activeCount}</span> Werte ·
        MAX: <span class="max">${max}</span> ·
        MIN: <span class="min">${min}</span> ·
        A3: <span class="value">${state.axis3.length}</span> ·
        A9: <span class="value">${state.axis9.length}</span> ·
        A27: <span class="value">${state.axis27?.length || 0}</span> ·
        A81: <span class="value">${state.axis81?.length || 0}</span>
        ${state.respo ? ' · 🌀 RESPO' : ''}
        ${state.stage ? ' · 🎯 STAGE' : ''}
        ${state.maxMode ? ' · ⬆ MAX' : ''}
        ${state.minMode ? ' · ⬇ MIN' : ''}
    `;
}

// ─── RUN ────────────────────────────────────────────────────
function run() {
    const values = state.values;

    try {
        const result = UNIEngine.RUN('stage', values);
        state = {
            ...state,
            axis3: result.axis3,
            axis9: result.axis9,
            axis27: result.axis27,
            axis81: result.axis81,
            pipeline21: result.pipeline21,
            life360: result.life360,
            blitz21: result.blitz21,
            graviton: result.graviton,
            shadow: result.shadow
        };

        state.aluf = ALUF.exit('STAGE');
        state.evo = EVOTAAL.solve(values);
        state.nirwana = NIRWANA.RUN(values);

        render(values);

        log.innerHTML = `
            <span class="key">📊 STAGE</span>
            <span class="str"> · AXIS3: [${result.axis3.join(', ')}]</span>
            <span class="str"> · AXIS9: ${result.axis9.length}</span>
            <span class="str"> · AXIS27: ${result.axis27?.length || 0}</span>
            <span class="str"> · AXIS81: ${result.axis81?.length || 0}</span>
            <span class="str"> · GRAV: ${result.graviton?.USED || 0}/${result.graviton?.RAW || 0}</span>
            <span class="str"> · MAX: ${result.axis3[result.axis3.length-1] || '—'}</span>
            <span class="str"> · MIN: ${result.axis3[0] || '—'}</span>
            ${state.respo ? '\n<span class="key">🌀 RESPO: </span><span class="str">aktiv</span>' : ''}
            ${state.stage ? '\n<span class="key">🎯 STAGE: </span><span class="str">aktiv</span>' : ''}
        `;

        pulse.classList.add('active');

    } catch (e) {
        status.innerHTML = `❌ FEHLER: ${e.message}`;
        log.textContent = `ERROR: ${e.message}`;
        console.error(e);
    }
}

// ─── RESET ──────────────────────────────────────────────────
function reset() {
    state.values = [3, 9, 27, 81, 243, 729, 2187, 6561, 19683];
    state.axis3 = [];
    state.axis9 = [];
    state.axis27 = [];
    state.axis81 = [];
    state.pipeline21 = [];
    state.life360 = [];
    state.blitz21 = [];
    state.graviton = {};
    state.shadow = null;
    state.aluf = null;
    state.evo = null;
    state.nirwana = null;
    state.respo = false;
    state.stage = false;
    state.maxMode = false;
    state.minMode = false;

    pulse.classList.remove('active');
    render(state.values);
    status.innerHTML = '⟲ RESET · <span class="highlight">STAGE BEREIT</span>';
    log.textContent = '⟲ Reset durchgeführt. STAGE bereit.';
}

// ─── TOGGLES ─────────────────────────────────────────────────
function toggleRespo() {
    state.respo = !state.respo;
    render(state.values);
    log.textContent = state.respo ? '🌀 RESPO aktiv · Durchlassachse offen' : '🌀 RESPO deaktiviert';
}

function toggleStage() {
    state.stage = !state.stage;
    render(state.values);
    log.textContent = state.stage ? '🎯 STAGE aktiv · Bühne frei' : '🎯 STAGE deaktiviert';
}

function toggleMax() {
    state.maxMode = !state.maxMode;
    render(state.values);
    log.textContent = state.maxMode ? '⬆ MAXIMUM markiert' : '⬆ MAXIMUM deaktiviert';
}

function toggleMin() {
    state.minMode = !state.minMode;
    render(state.values);
    log.textContent = state.minMode ? '⬇ MINIMUM markiert' : '⬇ MINIMUM deaktiviert';
}

// ─── INIT ──────────────────────────────────────────────────
buildCube();
render(state.values);

// ─── EVENTS ──────────────────────────────────────────────────
btnRun.addEventListener('click', run);
btnReset.addEventListener('click', reset);
btnRespo.addEventListener('click', toggleRespo);
btnStage.addEventListener('click', toggleStage);
btnMax.addEventListener('click', toggleMax);
btnMin.addEventListener('click', toggleMin);

// ─── AUTO‑START ─────────────────────────────────────────────
setTimeout(() => {
    run();
    setTimeout(() => {
        status.innerHTML = `🚀 STAGE · DURCHLASSACHSE · <span class="highlight">iki1uc</span> · SYSTEM LIEF`;
    }, 400);
}, 300);

console.log('🎯 STAGE · DURCHLASSACHSE · RESPO.ai · iki1uc geladen');
console.log('📦 ROOT:', ROOT);
</script>
</body>
</html>
